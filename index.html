const clock=new THREE.Clock(),camTarget=new THREE.Vector3(),cameraRay=new THREE.Ray(),cameraHit=new THREE.Vector3(),cameraBounds=new THREE.Box3(),cameraDirection=new THREE.Vector3(),desiredCamera=new THREE.Vector3(),safeCamera=new THREE.Vector3();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);const forward=shopOpen?0:(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),side=shopOpen?0:(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),moving=!!(forward||side),sprinting=moving&&!riding&&(keys.ShiftLeft||keys.ShiftRight),speed=riding?(upgraded?14:11):(sprinting?7:4.1);if(moving){const dir=new THREE.Vector3(side,0,-forward).normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw),step=speed*dt,nx=player.position.x+dir.x*step,nz=player.position.z+dir.z*step;if(canOccupy(nx,player.position.z))player.position.x=nx;if(canOccupy(player.position.x,nz))player.position.z=nz;player.rotation.y=yaw+Math.atan2(side,-forward)}const phase=performance.now()*(sprinting?.016:.011),stride=moving&&!riding?Math.sin(phase)*(sprinting?.82:.5):0;if(!riding){arms[0].rotation.x=stride;arms[1].rotation.x=-stride;legs[0].rotation.x=-stride;legs[1].rotation.x=stride;body.position.y=moving?Math.abs(Math.sin(phase*2))*(sprinting?.1:.035):0;body.rotation.x=moving?(sprinting?-.075:-.025):0;body.rotation.z=moving?Math.sin(phase)*.025:0}
player.position.x=THREE.MathUtils.clamp(player.position.x,-103,103);player.position.z=THREE.MathUtils.clamp(player.position.z,-103,103);if(riding){scooter.position.set(player.position.x,0,player.position.z);scooter.rotation.y=player.rotation.y-Math.PI/2}const back=new THREE.Vector3(0,riding?3.4:3.1,riding?8.1:6.7).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camTarget.set(player.position.x,1.35,player.position.z);desiredCamera.copy(camTarget).add(back);cameraDirection.subVectors(desiredCamera,camTarget).normalize();cameraRay.set(camTarget,cameraDirection);let cameraDistance=back.length();for(const b of colliders){cameraBounds.min.set(b.minX,b.minY,b.minZ);cameraBounds.max.set(b.maxX,b.maxY,b.maxZ);const hit=cameraRay.intersectBox(cameraBounds,cameraHit);if(hit){const distance=hit.distanceTo(camTarget);if(distance>.2)cameraDistance=Math.min(cameraDistance,Math.max(.8,distance-.45))}}safeCamera.copy(camTarget).addScaledVector(cameraDirection,cameraDistance);if(cameraDistance<back.length())camera.position.copy(safeCamera);else camera.position.lerp(desiredCamera,1-Math.pow(.001,dt));camera.lookAt(camTarget.x,camTarget.y+.3,camTarget.z);if(!riding)updatePrompt();marker.rotation.y+=dt*.5;marker.material.opacity=.22+Math.sin(performance.now()*.003)*.08;renderer.render(scene,camera)}
player.position.set(-1,0,35);camera.position.set(-1,4,42);setTask();loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
